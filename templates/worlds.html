<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | Worlds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#050505;--glass:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.08);}
        body{background:var(--bg);color:white;font-family:'Plus Jakarta Sans',sans-serif;padding:40px 20px;min-height:100vh;}
        .gradient-text{background:linear-gradient(to right,#fff,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .world-card{background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:32px;transition:0.3s;cursor:pointer;text-decoration:none;color:white;display:block;position:relative;overflow:hidden;}
        .world-card:hover{transform:translateY(-6px);color:white;}
        .world-card::before{content:'';position:absolute;inset:0;border-radius:24px;opacity:0;transition:0.3s;}
        .world-card:hover::before{opacity:1;}
        .world-tech:hover{border-color:#6366f1;box-shadow:0 20px 60px rgba(99,102,241,0.15);}
        .world-creative:hover{border-color:#a855f7;box-shadow:0 20px 60px rgba(168,85,247,0.15);}
        .world-research:hover{border-color:#06b6d4;box-shadow:0 20px 60px rgba(6,182,212,0.15);}
        .world-economy:hover{border-color:#f59e0b;box-shadow:0 20px 60px rgba(245,158,11,0.15);}
        .match-pill{padding:6px 16px;border-radius:100px;font-size:0.8rem;font-weight:800;}
        .ai-badge{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#a5b4fc;padding:2px 10px;border-radius:100px;font-size:0.7rem;font-weight:700;}
        .emoji-big{font-size:3rem;margin-bottom:16px;display:block;}
    </style>
</head>
<body>
<div class="container" style="max-width:1000px;">
    <div class="d-flex justify-content-between align-items-start mb-5 flex-wrap gap-3">
        <div>
            <a href="/dashboard" class="text-secondary text-decoration-none d-block mb-2">← Dashboard</a>
            <h1 class="fw-bold gradient-text mb-1">Explore Worlds</h1>
            <p class="text-secondary mb-0">AI-ranked based on your niche and skills.</p>
        </div>
        <span class="ai-badge">🤖 AI Ranked for You</span>
    </div>

    <div class="row g-4">
        {% for w in worlds %}
        <div class="col-md-6">
            <a href="/world/{{ w.id }}" class="world-card world-{{ w.id }}">
                <span class="emoji-big">{{ w.emoji }}</span>
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h4 class="fw-bold mb-0">{{ w.title }}</h4>
                    <span class="match-pill" style="
                        {% if w.match >= 85 %}background:rgba(0,255,136,0.1);border:1px solid #00ff88;color:#00ff88;
                        {% elif w.match >= 70 %}background:rgba(99,102,241,0.1);border:1px solid #6366f1;color:#a5b4fc;
                        {% else %}background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;{% endif %}
                    ">{{ w.match }}% match</span>
                </div>
                <p class="text-secondary mb-3" style="font-size:0.9rem;">{{ w.desc }}</p>
                <small class="text-secondary">{{ w.project_count }} project{% if w.project_count != 1 %}s{% endif %} active</small>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
