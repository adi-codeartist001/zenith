<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith | Elite Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg:#050505; --a1:#ff007a; --a2:#00f2ff; --a3:#7000ff; --glass:rgba(255,255,255,0.03); }
        *{margin:0;padding:0;box-sizing:border-box;}
        body,html{width:100%;height:100%;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:white;overflow:hidden;display:flex;justify-content:center;align-items:center;}
        .sticker-field{position:fixed;inset:0;z-index:1;pointer-events:none;}
        .sticker{position:absolute;filter:drop-shadow(0 0 15px rgba(255,255,255,0.2));animation:pop-float 12s infinite ease-in-out;opacity:0.6;}
        @keyframes pop-float{0%,100%{transform:translate(0,0) rotate(0deg) scale(1);}33%{transform:translate(30px,-50px) rotate(15deg) scale(1.1);}66%{transform:translate(-20px,20px) rotate(-10deg) scale(0.9);}}
        #cursor-glow{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(112,0,255,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:2;transform:translate(-50%,-50%);transition:width 0.3s,height 0.3s;}
        .hero{position:relative;z-index:10;text-align:center;}
        .live-stats{display:flex;gap:30px;justify-content:center;margin-bottom:28px;}
        .live-pill{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 22px;border-radius:100px;font-size:0.75rem;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
        .pulse-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;animation:pulse-anim 1.5s infinite;}
        @keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}
        .status-badge{background:linear-gradient(90deg,var(--a3),var(--a1));padding:2px;border-radius:100px;display:inline-block;margin-bottom:20px;animation:pulse-border 2s infinite;}
        .status-inner{background:var(--bg);padding:6px 20px;border-radius:100px;font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;}
        h1{font-size:8rem;font-weight:800;line-height:0.85;letter-spacing:-5px;margin:0;background:linear-gradient(180deg,#fff 40%,#444 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        h1 span{display:block;color:#fff;-webkit-text-fill-color:white;opacity:0.9;}
        .tagline{color:#888;margin:30px 0;font-size:1.1rem;letter-spacing:1px;}
        .btn-group{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;}
        .btn-zenith{position:relative;background:#fff;color:#000;padding:22px 50px;border-radius:15px;font-weight:800;text-decoration:none;text-transform:uppercase;overflow:hidden;transition:0.3s;display:inline-block;}
        .btn-zenith:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(255,255,255,0.4);}
        .btn-login{position:relative;background:transparent;color:#fff;padding:22px 50px;border-radius:15px;font-weight:800;text-decoration:none;text-transform:uppercase;border:1px solid rgba(255,255,255,0.2);transition:0.3s;display:inline-block;}
        .btn-login:hover{border-color:var(--a2);color:var(--a2);}
        .voice-btn{position:fixed;bottom:30px;right:30px;z-index:100;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:white;padding:14px 22px;border-radius:50px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:0.3s;backdrop-filter:blur(10px);}
        .voice-btn:hover{background:rgba(112,0,255,0.2);border-color:var(--a3);}
        @keyframes pulse-border{0%{box-shadow:0 0 0 0 rgba(112,0,255,0.4);}70%{box-shadow:0 0 0 15px rgba(112,0,255,0);}100%{box-shadow:0 0 0 0 rgba(112,0,255,0);}}
        #bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0.25;pointer-events:none;}
        .voice-btn.playing{background:rgba(112,0,255,0.25);border-color:var(--a3);box-shadow:0 0 20px rgba(112,0,255,0.3);}
    </style>
</head>
<body>
    <!-- BACKGROUND VIDEO — looping, muted, always on -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='bg.mp4') }}" type="video/mp4">
    </video>

    <div id="cursor-glow"></div>
    <div class="sticker-field" id="field"></div>

    <div class="hero">
        <!-- LIVE STATS from DB -->
        <div class="live-stats">
            <div class="live-pill"><span class="pulse-dot"></span> {{ total_users }} Scholars Active</div>
            <div class="live-pill">🚀 {{ total_projects }} Projects Live</div>
        </div>

        <div class="status-badge">
            <div class="status-inner">⚡ Zenith Network — Now Live</div>
        </div>

        <h1>REACH<span>Your Zenith</span></h1>
        <p class="tagline">The elite AI-powered collaboration engine for the next generation.</p>

        <div class="btn-group">
            <a href="/register" class="btn-zenith">INITIALIZE JOURNEY</a>
            <a href="/login" class="btn-login">LOGIN</a>
        </div>
    </div>

    <!-- AI VOICE NARRATION -->
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
        🎙️ <span id="voiceLabel">Play Intro</span>
    </button>

    <!-- ElevenLabs / TTS audio — place your narration.mp3 in static/ -->
    <audio id="zenith-voice" preload="auto">
        <source src="{{ url_for('static', filename='narration.mp3') }}" type="audio/mpeg">
    </audio>

    <script>
        // STICKERS
        const field = document.getElementById('field');
        const icons = ['atom','microscope','rocket','brain-circuit','component','flask-conical','binary','cpu'];
        const colors = ['#ff007a','#00f2ff','#7000ff','#ffffff'];
        for (let i = 0; i < 15; i++) {
            const div = document.createElement('div');
            div.className = 'sticker';
            const icon = icons[Math.floor(Math.random() * icons.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            div.style.left = Math.random() * 90 + '%';
            div.style.top = Math.random() * 90 + '%';
            div.style.color = color;
            div.style.animationDelay = (Math.random() * 5) + 's';
            div.style.animationDuration = (8 + Math.random() * 10) + 's';
            div.innerHTML = `<i data-lucide="${icon}" size="${24 + Math.random() * 40}"></i>`;
            field.appendChild(div);
        }
        lucide.createIcons();

        // CURSOR GLOW
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // VOICE NARRATION (audio only — video always plays in background)
        const audio = document.getElementById('zenith-voice');
        const voiceBtn = document.getElementById('voiceBtn');
        let playing = false;
        function toggleVoice() {
            const btn = document.getElementById('voiceLabel');
            if (!playing) {
                audio.play().then(() => {
                    playing = true;
                    btn.textContent = 'Pause Intro';
                    voiceBtn.classList.add('playing');
                }).catch(() => {
                    btn.textContent = 'Add narration.mp3 to static/';
                });
            } else {
                audio.pause();
                playing = false;
                btn.textContent = 'Play Intro';
                voiceBtn.classList.remove('playing');
            }
        }
        audio.addEventListener('ended', () => {
            playing = false;
            document.getElementById('voiceLabel').textContent = 'Play Intro';
            voiceBtn.classList.remove('playing');
        });
    </script>
</body>
</html>
